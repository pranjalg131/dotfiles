# ── Prefix ────────────────────────────────────────────────────────────────
unbind-key C-b
bind-key ` send-prefix
set -g prefix `

# ── Terminal & Colour ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── General ───────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -s escape-time 0
set -g focus-events on

# ── Window naming: show current directory basename ────────────────────────
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# ── Pane splits (preserve current path) ──────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Catppuccin Latte Palette ──────────────────────────────────────────────
#   Base:     #eff1f5   Crust:    #dce0e8
#   Text:     #4c4f69   Subtext0: #6c6f85   Subtext1: #5c5f77
#   Surface0: #ccd0da   Surface1: #bcc0cc   Overlay0: #9ca0b0
#   Mauve:    #8839ef   Blue:     #1e66f5
#   Green:    #40a02b   Peach:    #fe640b   Teal:     #179299
#
# Powerline glyphs (Nerd Font required):
#    U+E0B0  filled right arrow  ← ends a left-status segment
#    U+E0B2  filled left arrow   ← starts a right-status segment

# ── Status Bar ────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=#eff1f5,fg=#4c4f69"

# Left:  [mauve]  session [►base]
set -g status-left-length 40
set -g status-left "#[fg=#8839ef,bg=#eff1f5]#[fg=#dce0e8,bg=#8839ef,bold]  #S  #[fg=#8839ef,bg=#eff1f5]"

# ── Window List ───────────────────────────────────────────────────────────
# Inactive: index + name, dimmed on base
set -g window-status-format " #[fg=#9ca0b0]#I #[fg=#6c6f85]#W "

# Active: green pill  ►  name  ◄
set -g window-status-current-format "#[fg=#40a02b,bg=#eff1f5]#[fg=#dce0e8,bg=#40a02b,bold]  #W  #[fg=#40a02b,bg=#eff1f5]"

set -g window-status-separator ""

# ── Right: [base◄blue]  host [blue◄surface0]  date [surface0◄surface1]  time
set -g status-right-length 80
set -g status-right "#[fg=#1e66f5,bg=#eff1f5]#[fg=#dce0e8,bg=#1e66f5]  #h  #[fg=#1e66f5,bg=#eff1f5] #[fg=#ccd0da,bg=#eff1f5]#[fg=#5c5f77,bg=#ccd0da]  %a %d %b  #[fg=#ccd0da,bg=#eff1f5] #[fg=#bcc0cc,bg=#eff1f5]#[fg=#4c4f69,bg=#bcc0cc]  %H:%M  #[fg=#bcc0cc,bg=#eff1f5]"

# ── Pane Borders ──────────────────────────────────────────────────────────
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#8839ef"

# ── Message / Command Line ────────────────────────────────────────────────
set -g message-style "bg=#8839ef,fg=#dce0e8,bold"
set -g message-command-style "bg=#40a02b,fg=#dce0e8,bold"

# ── Copy Mode ─────────────────────────────────────────────────────────────
set -g mode-style "bg=#fe640b,fg=#dce0e8"
